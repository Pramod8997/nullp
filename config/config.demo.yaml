# Demo profile — consumer-electronics bench loads
#
# Use when the loads plugged into the relay are a laptop, projector, monitor or
# desktop rather than a kettle/HVAC. The default config/config.yaml has a
# 3500 W aggregate ceiling, which ~400 W of demo load can never approach, so
# the safety cutoff would look broken (it never fires) with the default file.
#
#   python scripts/run_pipeline.py --config config/config.demo.yaml
#
# Anything not overridden here mirrors config/config.yaml.

app:
  name: "Digital Twin EMS — Demo Profile"
  debug: true

mqtt:
  broker: "localhost"
  port: 1883
  qos_safety: 1
  qos_telemetry: 0
  topics:
    reads: "home/sensor/+/power"
    writes: "home/plug/+/command"
    events: "home/ui/events"

database:
  path: "data/ems_state.db"
  fallback_csv: "data/fallback_measurements.csv"
  retention_days: 30

protonet:
  seq_len: 128
  embedding_size: 128
  distance_threshold: 15.0
  confidence_threshold: 0.90
  # Demo-profile weights: consumer-electronics class set trained by
  # scripts/train_demo_models.py. The general 10-class model spans 3 W-3.5 kW
  # and is weakest exactly in this band.
  weights_path: "backend/models/weights_demo/protonet.pt"

# Real measured draw of typical bench loads, for reference:
#   phone charger / powerbank  5-120 W   (3-10W standby/trickle -> PhantomTracker; 18-120W USB-PD -> ProtoNet/NILM)
#   computer monitor           20-60 W
#   laptop computer            30-200 W  (30-65W ultrabook, 70-200W gaming/workstation)
#   desktop computer           80-350 W
#   projector                  30-400 W  (LED 30-50W, lamp 200-400W)
#   router                     5-25 W
devices:
  # PHYSICAL: declared here only so `make demo` does not warn about an unknown
  # node id if the real board is on the broker. The real one-port rig should be
  # run from config/config.hardware.yaml, which has the correct 250 W ceiling.
  # See claude_debug/HARDWARE_FINAL_SPEC.md (scope S2/S5, decision D8).
  node_bench_agg: { simulated: false, rated: 250, tier0: false }

  # SIMULATED: the `make demo` software fleet, published by
  # backend/scripts/simulate_esp32.py DEMO_DEVICES. No hardware exists for these.
  node_laptop:    { simulated: true, rated: 200, tier0: false }
  node_projector: { simulated: true, rated: 400, tier0: false }
  node_monitor:   { simulated: true, rated: 60,  tier0: false }
  node_desktop:   { simulated: true, rated: 350, tier0: false }
  node_charger:   { simulated: true, rated: 120, tier0: false }

appliances:
  - laptop
  - desktop_computer
  - monitor
  - projector
  - tv
  - router
  - phone_charger

# Scaled so the safety path is actually demonstrable at bench power levels.
# 600 W ceiling: a laptop + projector + monitor together (~530 W) sits in the
# warning band, and adding the desktop trips CRITICAL.
#
# NOTE: this ceiling serves the SIMULATED fleet below (~1130 W of profiles in
# backend/scripts/simulate_esp32.py). The physical one-port rig draws only
# 150-320 W and needs a 250 W ceiling to trip at all -- it has its own file,
# config/config.hardware.yaml. Do not merge the two.
system_safety:
  max_aggregate_wattage: 600.0
  warning_pct: 1.10
  critical_pct: 1.25
  laptop:           { max_w: 220, tier0: false }
  desktop_computer: { max_w: 400, tier0: false }
  monitor:          { max_w: 75,  tier0: false }
  projector:        { max_w: 450, tier0: false }
  tv:               { max_w: 300, tier0: false }
  router:           { max_w: 30,  tier0: true }   # keep the network up
  phone_charger:    { max_w: 130, tier0: false }

system:
  max_tracked_devices: 200
  device_ttl_seconds: 3600

# ── Demo caveats ─────────────────────────────────────────────────────────────
# 1. Phone charger / Powerbank Detection:
#    - Low trickle / standby (<20 W) is below TRANSIENT_THRESHOLD_W (20 W)
#      and is tracked as standby/phantom load via PhantomTracker.
#    - Fast chargers / USB-PD (18 W - 120 W) cross the 20 W step-change threshold
#      and trigger active NILM transient detection + ProtoNet/heuristic classification.
# 2. Fit the PZEM-004T v3.0 **10 A direct-connect** variant, not the 100 A CT
#    variant — see claude_debug/HARDWARE_FINAL_SPEC.md D1.
# 3. Load-branch fuse is **5 A**, not 2-3 A. At the 125% CRITICAL trip the branch
#    draws 750 W = 3.26 A @ 230 V (4.17 A at a 180 V brownout, since SMPS loads are
#    constant-power and draw MORE current as voltage sags). A 2-3 A fuse would blow
#    before the relay could ever demonstrate a cutoff. See HARDWARE_FINAL_SPEC.md D8.
