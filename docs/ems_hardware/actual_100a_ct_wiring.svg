<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc">
  <title id="title">EMS actual hardware wiring: 38-pin ESP32 and PZEM-004T-100A CT</title>
  <desc id="desc">Low-voltage pin-to-pin wiring is separated from electrician-only mains orientation. The PZEM 100 ampere CT version uses CT terminals and does not carry load current through a shunt.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="arrow-brown" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#7c2d12"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#15803d"/></marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .section { font: 700 26px Arial, sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, sans-serif; fill: #111827; }
      .body { font: 18px Arial, sans-serif; fill: #1f2937; }
      .small { font: 15px Arial, sans-serif; fill: #374151; }
      .pin { font: 700 17px Arial, sans-serif; fill: #111827; }
      .box { stroke: #374151; stroke-width: 3; rx: 14; }
      .wire5 { stroke: #dc2626; stroke-width: 7; fill: none; }
      .wiregnd { stroke: #111827; stroke-width: 7; fill: none; }
      .signal { stroke: #d97706; stroke-width: 6; fill: none; }
      .signal-dash { stroke: #d97706; stroke-width: 6; stroke-dasharray: 13 10; fill: none; }
      .live { stroke: #7c2d12; stroke-width: 8; fill: none; marker-end: url(#arrow-brown); }
      .neutral { stroke: #2563eb; stroke-width: 8; fill: none; }
      .earth { stroke: #15803d; stroke-width: 8; fill: none; marker-end: url(#arrow-green); }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 3; rx: 12; }
      .info { fill: #fef3c7; stroke: #d97706; stroke-width: 3; rx: 12; }
      .safe { fill: #dcfce7; stroke: #15803d; stroke-width: 3; rx: 12; }
      .terminal { fill: #fff; stroke: #374151; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1420" fill="#ffffff"/>
  <text x="900" y="52" text-anchor="middle" class="title">EMS Hardware Wiring — Actual PZEM-004T-100A CT Board</text>
  <text x="900" y="84" text-anchor="middle" class="body">38-pin ESP32-WROOM-32 • GPIO16/17 = UART2 • GPIO18 = active-high relay</text>

  <!-- Low voltage section -->
  <rect x="35" y="112" width="1730" height="635" fill="#f8fafc" stroke="#64748b" stroke-width="3" rx="18"/>
  <text x="70" y="155" class="section">1. LOW-VOLTAGE BENCH WIRING — BUILD THIS FIRST, WITH MAINS DISCONNECTED</text>
  <rect x="70" y="175" width="1660" height="66" class="warning"/>
  <text x="900" y="204" text-anchor="middle" class="label" fill="#991b1b">NO 230 VAC • NO RELAY CONTACT WIRING • NO PZEM AC/CT WIRING</text>
  <text x="900" y="228" text-anchor="middle" class="body">Use Dupont wires only on this low-voltage side. Verify relay labels before applying 5 V.</text>

  <!-- ESP32 -->
  <rect x="80" y="280" width="390" height="390" fill="#dbeafe" class="box"/>
  <text x="275" y="322" text-anchor="middle" class="label">ESP32 DevKit — 38-pin</text>
  <text x="275" y="350" text-anchor="middle" class="body">WROOM-32 / D0WD-V3</text>
  <line x1="425" y1="390" x2="470" y2="390" class="wire5"/>
  <text x="105" y="397" class="pin">VIN / 5V</text>
  <line x1="425" y1="435" x2="470" y2="435" class="wiregnd"/>
  <text x="105" y="442" class="pin">GND</text>
  <line x1="425" y1="500" x2="470" y2="500" class="signal"/>
  <text x="105" y="507" class="pin">GPIO18 / D18</text>
  <line x1="425" y1="560" x2="470" y2="560" class="signal"/>
  <text x="105" y="567" class="pin">GPIO17 / TX2</text>
  <line x1="425" y1="620" x2="470" y2="620" class="signal-dash"/>
  <text x="105" y="627" class="pin">GPIO16 / RX2</text>
  <text x="105" y="658" class="small">Do not use TX0/RX0.</text>

  <!-- Relay -->
  <rect x="610" y="280" width="430" height="275" fill="#fef3c7" class="box"/>
  <text x="825" y="322" text-anchor="middle" class="label">Relay Module — Channel 1</text>
  <text x="825" y="350" text-anchor="middle" class="body">SRD-05VDC-SL-C • H/high-trigger</text>
  <text x="650" y="397" class="pin">VCC / +5V</text>
  <line x1="610" y1="390" x2="570" y2="390" class="wire5"/>
  <text x="650" y="442" class="pin">GND</text>
  <line x1="610" y1="435" x2="570" y2="435" class="wiregnd"/>
  <text x="650" y="507" class="pin">IN1</text>
  <line x1="610" y1="500" x2="570" y2="500" class="signal"/>
  <text x="650" y="545" class="small">Set selector to H.</text>
  <text x="650" y="575" class="small">Verify VCC/JD-VCC labels</text>
  <text x="650" y="597" class="small">on the physical board.</text>

  <!-- Pulldown -->
  <line x1="570" y1="500" x2="570" y2="640" stroke="#d97706" stroke-width="5"/>
  <rect x="535" y="540" width="70" height="52" fill="#fff" stroke="#374151" stroke-width="2"/>
  <text x="570" y="572" text-anchor="middle" class="small">100kΩ</text>
  <line x1="570" y1="592" x2="570" y2="640" class="wiregnd"/>
  <text x="485" y="632" class="small">IN1 → GND</text>

  <!-- PZEM TTL -->
  <rect x="1220" y="280" width="430" height="275" fill="#ede9fe" class="box"/>
  <text x="1435" y="322" text-anchor="middle" class="label">PZEM TTL Header</text>
  <text x="1435" y="350" text-anchor="middle" class="body">100A CT version • 4-pin passive TTL</text>
  <text x="1260" y="397" class="pin">GND</text>
  <line x1="1220" y1="390" x2="1175" y2="390" class="wiregnd"/>
  <text x="1260" y="442" class="pin">TX</text>
  <line x1="1220" y1="435" x2="1175" y2="435" class="signal-dash"/>
  <text x="1260" y="487" class="pin">RX</text>
  <line x1="1220" y1="480" x2="1175" y2="480" class="signal"/>
  <text x="1260" y="532" class="pin">5V</text>
  <line x1="1220" y1="525" x2="1175" y2="525" class="wire5"/>

  <!-- 5V/GND common bus -->
  <line x1="470" y1="390" x2="570" y2="390" class="wire5"/>
  <line x1="570" y1="390" x2="570" y2="390" class="wire5"/>
  <line x1="1040" y1="390" x2="1175" y2="525" class="wire5"/>
  <line x1="470" y1="435" x2="570" y2="435" class="wiregnd"/>
  <line x1="570" y1="435" x2="1175" y2="390" class="wiregnd"/>
  <!-- relay signal -->
  <line x1="470" y1="500" x2="570" y2="500" class="signal"/>
  <!-- UART crossed -->
  <path d="M470 560 L1120 560 L1120 480 L1175 480" class="signal"/>
  <path d="M470 620 L1080 620 L1080 435 L1175 435" class="signal-dash"/>

  <rect x="1090" y="590" width="590" height="115" class="info"/>
  <text x="1110" y="620" class="label">PZEM TX CHECK BEFORE GPIO16</text>
  <text x="1110" y="648" class="body">Measure TX-to-GND with only PZEM 5V/GND connected.</text>
  <text x="1110" y="675" class="body">~3.3 V: direct • ~5 V: 1 kΩ / 2 kΩ divider • floating: verify pull-up.</text>

  <!-- Mains section -->
  <rect x="35" y="780" width="1730" height="590" fill="#fff7ed" stroke="#9a3412" stroke-width="3" rx="18"/>
  <text x="70" y="825" class="section">2. PZEM CT / MAINS ORIENTATION — QUALIFIED ELECTRICIAN ONLY</text>
  <rect x="70" y="845" width="1660" height="68" class="warning"/>
  <text x="900" y="875" text-anchor="middle" class="label" fill="#991b1b">NEVER BUILD THIS SECTION ON THE BREADBOARD</text>
  <text x="900" y="899" text-anchor="middle" class="body">Use an enclosed installation, 1.0 mm² mains wire, suitable terminals, PE bonding, and upstream 30 mA RCD/RCBO.</text>

  <!-- Source and fuse -->
  <rect x="90" y="1000" width="230" height="140" fill="#f3f4f6" class="box"/>
  <text x="205" y="1040" text-anchor="middle" class="label">Wall inlet</text>
  <text x="125" y="1082" class="body">L  N  PE</text>
  <text x="125" y="1110" class="small">30 mA RCD/RCBO upstream</text>

  <rect x="390" y="1010" width="145" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="3" rx="8"/>
  <text x="462" y="1053" text-anchor="middle" class="label">5 A fuse</text>
  <line x1="320" y1="1035" x2="390" y2="1035" class="live"/>

  <!-- PZEM AC/CT -->
  <rect x="650" y="950" width="310" height="275" fill="#ede9fe" class="box"/>
  <text x="805" y="990" text-anchor="middle" class="label">PZEM 100A CT</text>
  <text x="805" y="1018" text-anchor="middle" class="body">AC/CT terminal block</text>
  <text x="690" y="1062" class="pin">1 CT</text>
  <text x="690" y="1094" class="pin">2 CT</text>
  <text x="690" y="1126" class="pin">3 N</text>
  <text x="690" y="1158" class="pin">4 L</text>
  <text x="690" y="1194" class="small">L/N are voltage sense.</text>
  <text x="690" y="1216" class="small">Load current does not pass</text>
  <text x="690" y="1238" class="small">through a shunt on this board.</text>

  <!-- Relay contacts -->
  <rect x="1060" y="950" width="250" height="175" fill="#fef3c7" class="box"/>
  <text x="1185" y="992" text-anchor="middle" class="label">Relay CH1</text>
  <text x="1185" y="1030" text-anchor="middle" class="body">COM → NO only</text>
  <text x="1088" y="1080" class="pin">COM</text>
  <text x="1250" y="1080" class="pin">NO</text>
  <text x="1088" y="1110" class="small">NC unused</text>

  <!-- Socket -->
  <rect x="1470" y="950" width="230" height="175" fill="#dcfce7" class="box"/>
  <text x="1585" y="992" text-anchor="middle" class="label">6 A socket</text>
  <text x="1585" y="1025" text-anchor="middle" class="body">L  N  PE</text>
  <text x="1585" y="1060" text-anchor="middle" class="small">earthed 3-pin</text>
  <text x="1585" y="1090" text-anchor="middle" class="small">multi-plug/load</text>

  <!-- Mains wires -->
  <line x1="535" y1="1035" x2="650" y2="1035" class="live"/>
  <line x1="535" y1="1035" x2="535" y2="1065" class="live"/>
  <line x1="535" y1="1065" x2="1060" y2="1065" class="live"/>
  <line x1="960" y1="1065" x2="1060" y2="1065" class="live"/>
  <line x1="1310" y1="1065" x2="1470" y2="1065" class="live"/>
  <line x1="320" y1="1070" x2="650" y2="1120" class="neutral"/>
  <line x1="320" y1="1070" x2="1470" y2="1030" class="neutral"/>
  <line x1="320" y1="1105" x2="1470" y2="1100" class="earth"/>

  <!-- CT ring -->
  <ellipse cx="1385" cy="1065" rx="38" ry="54" fill="none" stroke="#7c2d12" stroke-width="8"/>
  <line x1="1310" y1="1065" x2="1450" y2="1065" class="live"/>
  <text x="1385" y="1148" text-anchor="middle" class="small">CT around LIVE only</text>
  <text x="1385" y="1170" text-anchor="middle" class="small">arrow → load</text>
  <line x1="1350" y1="1000" x2="1420" y2="1000" class="live"/>
  <text x="1385" y="990" text-anchor="middle" class="small">source → load</text>

  <!-- CT secondary -->
  <path d="M650 1060 C580 930, 560 930, 560 1180 L650 1180" stroke="#7c2d12" stroke-width="5" fill="none"/>
  <path d="M650 1090 C600 940, 580 940, 580 1200 L650 1200" stroke="#7c2d12" stroke-width="5" fill="none"/>
  <text x="565" y="1265" text-anchor="middle" class="small">CT secondary leads</text>

  <!-- Ground annotation -->
  <rect x="90" y="1190" width="410" height="105" class="safe"/>
  <text x="110" y="1220" class="label">PE is never switched</text>
  <text x="110" y="1248" class="body">Wall PE → enclosure bond → socket PE.</text>
  <text x="110" y="1275" class="body">Never route PE through CT or relay.</text>

  <!-- Bottom rules -->
  <rect x="1030" y="1240" width="680" height="90" class="warning"/>
  <text x="1050" y="1270" class="label" fill="#991b1b">POWER RULE</text>
  <text x="1050" y="1297" class="body">Flash: laptop USB, mains disconnected.</text>
  <text x="1050" y="1322" class="body">Runtime: isolated 5 V charger, laptop USB removed.</text>

  <!-- Legend -->
  <line x1="70" y1="1390" x2="120" y2="1390" class="wire5"/><text x="130" y="1397" class="small">5 V</text>
  <line x1="220" y1="1390" x2="270" y2="1390" class="wiregnd"/><text x="280" y="1397" class="small">GND</text>
  <line x1="370" y1="1390" x2="420" y2="1390" class="signal"/><text x="430" y="1397" class="small">logic signal</text>
  <line x1="570" y1="1390" x2="620" y2="1390" class="live"/><text x="630" y="1397" class="small">live</text>
  <line x1="720" y1="1390" x2="770" y2="1390" class="neutral"/><text x="780" y="1397" class="small">neutral</text>
  <line x1="900" y1="1390" x2="950" y2="1390" class="earth"/><text x="960" y="1397" class="small">protective earth</text>
  <text x="1730" y="1397" text-anchor="end" class="small">Actual CT topology — not the old 10 A shunt diagram</text>
</svg>
