; PlatformIO Project Configuration File for ESP32 Smart Home EMS Node
; PZEM-004T 100A CT/V4-type UART + Dual-Core FreeRTOS Safety Node
;
; Build & Upload:
;   pio run --target upload
; Serial Monitor:
;   pio device monitor -b 115200

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32doit-devkit-v1
framework = arduino

; Serial Monitor
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; Flash Settings
upload_speed = 460800
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Library Dependencies
lib_deps =
    mandulaj/PZEM-004T-v30 @ ^1.1.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3

; Compiler Flags
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D MQTT_MAX_PACKET_SIZE=256

; Deliberately separate, safety-limited continuity-test firmware. It disables
; Wi-Fi/MQTT and accepts only DRY_ON/DRY_OFF/STATUS over USB. Use only with
; mains disconnected and relay COM/NO/NC disconnected from every load.
[env:bench]
platform = espressif32@^6.5.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed = 460800
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
lib_deps =
    mandulaj/PZEM-004T-v30 @ ^1.1.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D MQTT_MAX_PACKET_SIZE=256
    -D EMS_BENCH_MODE=1
