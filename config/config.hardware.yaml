# Physical prototype profile — the ONE real ESP32 + PZEM node, ONE 6 A socket
#
# This is the file to run when the hardware rig is powered. It is NOT
# config/config.demo.yaml: that file's 600 W ceiling serves the ~1130 W
# simulated fleet in backend/scripts/simulate_esp32.py, and would put the
# physical CRITICAL trip at 750 W -- unreachable for a laptop + phone charger,
# so the relay cutoff would look broken by never firing.
#
#   python scripts/run_pipeline.py --config config/config.hardware.yaml
#
# Anything not overridden here mirrors config/config.yaml.
# Hardware of record: docs/ems_hardware/ACTUAL_100A_CT_WIRING.md and the
# 38-pin/250 W physical scope below. The older 10 A shunt design is historical.

hardware:
  board: "ESP32-WROOM-32-38-pin"
  mains_voltage_v: 230.0
  mains_frequency_hz: 50.0
  pzem:
    model: "PZEM-004T v4.0 (100A)"
    topology: "external_ct"
    ttl_header: [GND, TX, RX, 5V]
    uart_baud: 9600
    pzem_rx_pin: 16
    pzem_tx_pin: 17
    tx_to_gpio16: "1k_2k_voltage_divider_to_3.3V"
    ac_terminals: "1:Live, 2:Neutral, 3:CT+, 4:CT-"
    max_safe_current_a: 32.0
    max_safe_voltage_v: 260.0
    min_safe_voltage_v: 180.0
    physical_validation: "pending"
  relay:
    available_channels: 4
    channels: [26, 27, 14, 32]
    channel_pins:
      ch1: 26
      ch2: 27
      ch3: 14
      ch4: 32
    trigger_target: "active-low opto-isolated"
    active_low: true
    boot_state: "HIGH/OFF"
  low_voltage_supply: "isolated/BIS-marked 5V 2A external charger"
  mains_release: "blocked_until_physical_gates_pass"

app:
  name: "Digital Twin EMS — Physical Prototype (1 node, 1 port)"
  debug: true
  demo_mode: false

# Physical deployments must use an explicitly enrolled registry and complete
# model artifact. Missing/partial demo artifacts fail closed to UNKNOWN.
deployment:
  require_physical_ml_artifacts: true

mqtt:
  broker: "localhost"
  port: 1883
  # qos_safety/qos_telemetry removed (2026-09-10): dead keys, never read.
  # Effective wire QoS is hardcoded (qos=1 for subscribe and publish in
  # src/hardware/mqtt.py); relay-command delivery is additionally assured by
  # app-level retries in MQTTClientManager.publish_command.
  topics:
    reads: "home/sensor/+/power"
    writes: "home/plug/+/command"
    events: "home/ui/events"

database:
  path: "data/ems_state.db"
  fallback_csv: "data/fallback_measurements.csv"
  retention_days: 30

protonet:
  seq_len: 128
  embedding_size: 128
  distance_threshold: 15.0
  confidence_threshold: 0.90
  # See config.demo.yaml for why this is a separate quantity from
  # confidence_threshold: it gates the agreement of two independent channels,
  # not a single softmax. Below it the load is reported unrecognised and the
  # operator is asked for a label — which on the physical rig is the *expected*
  # path for the phone charger, since no fitted constant can stand in for a
  # modern USB-PD charger (no such data exists in UK-DALE).
  recognition_threshold: 0.45
  heuristic_min_confidence: 0.55
  # Consumer-electronics class set from scripts/train_demo_models.py. The general
  # 10-class model spans 3 W-3.5 kW and is weakest exactly in this band.
  weights_path: "backend/models/weights_demo/protonet.pt"
  # ⚠ NO `registry_path` HERE, DELIBERATELY — and that means this rig does NOT
  # recognise its loads yet.
  #
  # Without the key the shipped UK-DALE registry is used, and that artifact
  # cannot represent this rig's loads: measured on
  # data/real/cache/ukdale_windows_demo.npz its `laptop` prototype is a 21 W
  # netbook (p50, p90 = 45 W) and its `phone_charger` has ZERO windows above the
  # 20 W on-threshold. A 65 W laptop and a 120 W USB-PD charger are out of
  # family for both, so every bench window comes back "unrecognised" and routes
  # to the LABEL_REQUEST loop. That is the honest answer, not a defect.
  #
  # To make the rig recognise its own loads, capture real PZEM windows and enrol:
  #   1. run each load alone on the bench, save 128-sample power windows (watts)
  #      per class into an .npz keyed by class name — see
   #      docs/ems_hardware/VALIDATION_STATUS.md and the current wiring guide;
  #   2. python scripts/enroll_demo_devices.py --capture bench.npz \
  #        --out backend/models/weights_demo/prototype_registry_bench.pt
  #   3. set registry_path to that file.
  # Enrolling from the SIMULATOR profiles (the demo default) would be a lie here:
  # it would make the dashboard show confident labels that no physical
  # measurement supports. Four-class recognition on this rig is
  # NOT PHYSICALLY VERIFIED until step 1 is actually performed on hardware.
  #
  # The alternative needing no capture is already live: let the operator label
  # each load once through the dashboard. handle_label_submitted enrols it with
  # the envelope measured on the real device, which is strictly better evidence
  # than any pre-seeded band.

devices:
  # The ONLY node. One ESP32, one active relay channel, one IS 1293 6 A socket.
  # A 3-pin multi-plug adapter in that socket puts the laptop and phone charger
  # on the same external CT at once -- that simultaneity is what gives NILM
  # something to disaggregate. One device at a time is single-appliance
  # classification, not disaggregation, and does not exercise
  # OverlapAwareNILMDetector.
  # tier0: true = NEVER_SHED (Run 0.8, RL opt-out). The pipeline passes THIS
  # file to the RL agent, and tier0 devices feed its SHED blacklist — with
  # exploration enabled, the agent could otherwise open the physical relay
  # uncommanded (~1 stray OFF per cooldown window once the promotion gate
  # latches). Re-checked as defense-in-depth at the publish site
  # (run_pipeline.py, device_is_critical).
  node_bench_agg: { simulated: false, rated: 250, tier0: true }

# Only the two classes the prototype can physically produce. The trained model
# still has all 7 heads; restricting the list here keeps the UI from advertising
# appliances that no socket on this rig can ever present.
# The physical prototype classes are laptop and phone. The LED bulb is
# deliberately absent: 9 W sits below the 20 W transient threshold, so it is
# phantom-load-tracked on the dashboard, never classified. Projector remains
# software/demo scope and is not authorized on this 250 W socket.
# `phone_charger` (the old UK-DALE-era name) is retired here — the physical
# USB-PD charger enrolls and classifies as `phone`.
appliances:
  - phone
  - laptop

# 250 W ceiling, sized so the cutoff is reachable with the loads on hand:
#   laptop 65 W + USB-PD charger 120 W + 100 W lamp = 285 W -> WARNING (275 W)
#   anything further                                        -> CRITICAL (312 W) -> relay opens
#
# Coordination ladder stays monotonic (HARDWARE_FINAL_SPEC.md D8):
#   250 W nominal -> WARN 275 W -> TRIP 312 W (1.36 A) -> 5 A fuse (1150 W)
#   -> 10 A relay/PZEM (2300 W) -> 13 A wire
# The 5 A fuse sits 3.7x above the trip, so the relay always acts first --
# that ordering is the whole point and must not be re-tuned casually.
system_safety:
  max_aggregate_wattage: 250.0
  warning_pct: 1.10
  critical_pct: 1.25
  # Per-device ceilings. run_pipeline.py:165 reads ONLY this mapping -- top-level
  # `laptop: {max_w: ...}` siblings (as written in config.demo.yaml) are inert.
  device_wattage_limits:
    default: 250.0
    node_bench_agg: 250.0

# RL agent (Run 0.8). The pipeline now passes THIS file to the agent, so the
# profile must carry its own rl: section — without one the agent falls back
# to its 15 s cooldown default instead of the 5-minute anti-short-cycling
# lockout the other profiles configure.
rl:
  cooldown_seconds: 300.0

# Phantom/standby-load channel (Run 1.2). 15 W keeps the LED bulb (5-12 W)
# tracked: such loads never cross the 20 W transient threshold, so they reach
# PhantomTracker only via the no-transient branch. Loads in (10, 15] W stay
# unattributed because that branch marks devices ON above 10 W — accepted
# and documented.
phantom:
  baseline_threshold_watts: 15.0

analytics:
  # INR per kWh (India) — the dashboard renders ₹. The previous hardcoded
  # 0.15 (USD-ish) understated cost ~40x.
  cost_per_kwh: 8.0

# NILM preprocessing / overlap (Run 3, WS-D). At a plug-in transient the
# detector returns the last 128 samples ENDING at the detection sample —
# 97-99% PRE-event data. On this one-port rig any plug-in onto an already
# running load would name the OLD load at confidence ~1.0. With delta_overlap
# the pipeline instead classifies the post-event DELTA (steady-after −
# steady-before) once post-event power has been stable for
# delta_stability_samples samples, through the same envelope gates as the
# window path. The rig has no enrolled registry yet (see protonet above), so
# until Run 2 enrolls one both paths route to the label loop — the flag is
# on so the delta layer is live the moment the bench registry lands.
#   - delta_min_baseline_w: pre-event steady below this = idle socket → the
#     proven sequential window path, untouched.
#   - Negative delta (unplug): no classification event (documented decision).
#   - Delta in a band gap: UNRECOGNISED → the existing label loop.
# Flip delta_overlap to false to restore the pure window behaviour (the
# pre-Run-3 fallback).
preprocessing:
  delta_overlap: true
  delta_min_baseline_w: 20.0
  delta_stability_samples: 5
