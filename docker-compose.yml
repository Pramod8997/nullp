version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: always
    # Issue #25: Health check for Mosquitto
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 30s
      timeout: 5s
      retries: 3

  ems-pipeline:
    build: .
    command: python scripts/run_pipeline.py
    environment:
      - MQTT_BROKER=mosquitto
      - PYTHONPATH=/app
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: always
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./backend/models/weights:/app/backend/models/weights

  ems-api:
    build: .
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER=mosquitto
      - PYTHONPATH=/app
      # Issue #7 & #8: Auth and CORS configuration
      - EMS_API_KEY=${EMS_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: always
    # Issue #25: Health check for API service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./src:/app/src
