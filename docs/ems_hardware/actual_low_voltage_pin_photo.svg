<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Annotated low-voltage connection photo for the actual EMS hardware</title>
  <desc id="desc">Annotated photographs of the actual ESP32, relay and PZEM hardware with a pin-to-pin connection table. Mains is disconnected.</desc>
  <defs>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 Z" fill="#d97706"/></marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .section { font: 700 25px Arial, sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, sans-serif; fill: #111827; }
      .body { font: 18px Arial, sans-serif; fill: #1f2937; }
      .small { font: 15px Arial, sans-serif; fill: #374151; }
      .panel { stroke: #475569; stroke-width: 3; rx: 14; }
      .red { stroke: #dc2626; stroke-width: 7; fill: none; marker-end: url(#orangeArrow); }
      .black { stroke: #111827; stroke-width: 7; fill: none; marker-end: url(#orangeArrow); }
      .orange { stroke: #d97706; stroke-width: 7; fill: none; marker-end: url(#orangeArrow); }
      .warning { fill: #fee2e2; stroke: #b91c1c; stroke-width: 3; rx: 12; }
      .info { fill: #fef3c7; stroke: #d97706; stroke-width: 3; rx: 12; }
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#fff"/>
  <text x="900" y="45" text-anchor="middle" class="title">LOW-VOLTAGE CONNECTION PHOTO — YOUR ACTUAL BOARDS</text>
  <text x="900" y="78" text-anchor="middle" class="body">38-pin ESP32 • 2-channel relay • PZEM-004T-100A CT version</text>
  <rect x="45" y="100" width="1710" height="66" class="warning"/>
  <text x="900" y="128" text-anchor="middle" class="label" fill="#991b1b">MAINS DISCONNECTED — DO NOT CONNECT PZEM CT/N/L OR RELAY COM/NO/NC</text>
  <text x="900" y="151" text-anchor="middle" class="small">Use only the low-voltage pins shown below. Verify physical labels before powering the relay.</text>

  <rect x="45" y="190" width="520" height="505" fill="#dbeafe" class="panel"/>
  <text x="305" y="222" text-anchor="middle" class="section">A. ESP32 — LOCATE PINS</text>
  <image href="../../Comp2.jpeg" x="75" y="245" width="460" height="410" preserveAspectRatio="xMidYMid meet"/>
  <rect x="75" y="245" width="460" height="410" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="85" y="680" class="small">USB connector is at the lower end of the photo.</text>

  <rect x="600" y="190" width="520" height="505" fill="#fef3c7" class="panel"/>
  <text x="860" y="222" text-anchor="middle" class="section">B. RELAY — LOW-VOLTAGE SIDE</text>
  <image href="../../Comp1.jpeg" x="630" y="245" width="460" height="410" preserveAspectRatio="xMidYMid meet"/>
  <rect x="630" y="245" width="460" height="410" fill="none" stroke="#92400e" stroke-width="2"/>
  <text x="640" y="680" class="small">Use channel 1 only. Confirm IN1, GND, VCC and H/L markings.</text>

  <rect x="1155" y="190" width="600" height="505" fill="#ede9fe" class="panel"/>
  <text x="1455" y="222" text-anchor="middle" class="section">C. PZEM — TTL HEADER</text>
  <image href="../../Comp2.jpeg" x="1185" y="245" width="540" height="330" preserveAspectRatio="xMidYMid meet"/>
  <rect x="1185" y="245" width="540" height="330" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <text x="1200" y="610" class="body">Manual header order:</text>
  <text x="1200" y="640" class="label">1 GND   2 TX   3 RX   4 5V</text>
  <text x="1200" y="672" class="small">AC/CT screw terminals stay disconnected here.</text>

  <rect x="45" y="735" width="1710" height="395" fill="#f8fafc" class="panel"/>
  <text x="80" y="775" class="section">PIN-TO-PIN CONNECTIONS</text>
  <text x="80" y="808" class="body">Red = 5V • black = GND • orange = GPIO/UART signal • Dupont wiring only</text>

  <text x="100" y="865" class="label">1</text><text x="140" y="865" class="body">ESP32 VIN/5V</text><line x1="390" y1="857" x2="500" y2="857" class="red"/><text x="525" y="865" class="body">Relay VCC / +5V</text>
  <text x="100" y="920" class="label">2</text><text x="140" y="920" class="body">ESP32 VIN/5V</text><line x1="390" y1="912" x2="500" y2="912" class="red"/><text x="525" y="920" class="body">PZEM 5V</text>
  <text x="100" y="975" class="label">3</text><text x="140" y="975" class="body">ESP32 GND</text><line x1="390" y1="967" x2="500" y2="967" class="black"/><text x="525" y="975" class="body">Relay GND + PZEM GND</text>
  <text x="100" y="1030" class="label">4</text><text x="140" y="1030" class="body">GPIO18 / D18</text><line x1="390" y1="1022" x2="500" y2="1022" class="orange"/><text x="525" y="1030" class="body">Relay IN1</text>
  <text x="100" y="1085" class="label">5</text><text x="140" y="1085" class="body">GPIO17 / TX2</text><line x1="390" y1="1077" x2="500" y2="1077" class="orange"/><text x="525" y="1085" class="body">PZEM RX</text>

  <text x="1050" y="865" class="label">6</text><text x="1090" y="865" class="body">Relay IN1</text><line x1="1270" y1="857" x2="1380" y2="857" class="black"/><text x="1405" y="865" class="body">100 kΩ → GND</text>
  <text x="1050" y="920" class="label">7</text><text x="1090" y="920" class="body">PZEM TX</text><line x1="1270" y1="912" x2="1380" y2="912" class="orange"/><text x="1405" y="920" class="body">STOP — measure TX first</text>
  <rect x="1040" y="960" width="640" height="125" class="info"/>
  <text x="1065" y="992" class="label">PZEM TX VOLTAGE CHECK</text>
  <text x="1065" y="1025" class="small">Connect PZEM 5V/GND only. Leave TX off GPIO16.</text>
  <text x="1065" y="1052" class="small">~3.3V: direct • ~5V: 1kΩ series + 2kΩ to GND.</text>
  <text x="1065" y="1079" class="small">Then connect PZEM TX → ESP32 GPIO16/RX2.</text>

  <text x="900" y="1175" text-anchor="middle" class="small">For the complete corrected CT/mains orientation, see actual_100a_ct_wiring.svg. Never place mains on the breadboard.</text>
</svg>
