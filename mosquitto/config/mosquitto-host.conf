# Host-usable broker config — the repo's docker conf
# (mosquitto/config/mosquitto.conf) uses container-only /mosquitto/* paths
# and dies instantly when launched on the host. This conf uses repo-root-
# relative paths (mosquitto resolves relative paths against its working
# directory — launch from the repo root, which scripts/demo_full_system.py
# does). Auth + ACL are identical to the docker conf.
#
#   cd <repo-root> && mosquitto -c mosquitto/config/mosquitto-host.conf
#
# Requires mosquitto/config/passwd to exist (NOT tracked — see
# passwd.example) with the users defined in mosquitto/config/acl.
listener 1883
allow_anonymous false
password_file mosquitto/config/passwd
acl_file mosquitto/config/acl
persistence false
log_dest stdout
log_type all
