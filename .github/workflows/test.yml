name: Full Test Suite

on: [push, pull_request]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports: ["1883:1883"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt --break-system-packages
      - run: pip install pytest pytest-asyncio pytest-cov hypothesis freezegun httpx --break-system-packages
      - name: Run Python tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=90 \
            -m "not e2e"
      - name: Enforce safety module 100% branch coverage
        run: |
          pytest tests/test_safety.py -v \
            --cov=src/pipeline/safety \
            --cov-branch \
            --cov-fail-under=100
      - uses: actions/upload-artifact@v4
        with: { name: coverage-xml, path: coverage.xml }

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: |
          cd frontend
          npm ci
          npm run test

  firmware-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y gcc cmake
      - run: |
          pip install conan --break-system-packages
          cd firmware/tests
          cmake . -DCMAKE_BUILD_TYPE=Release
          make
          ./run_host_tests

  coverage-comment:
    needs: [python-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: coverage-xml }
      - uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml
          title: "Test Coverage Report"
